version: '3.8'

services:
  # ----------------------------------------------------------------
  # 1. Frontend Web Studio (Nginx + Built Production React SPA)
  # ----------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meo-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      - NODE_ENV=production
    networks:
      - meo-net

  # ----------------------------------------------------------------
  # 2. Node.js Backend API Service (REST & Scaffolding API)
  # ----------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: meo-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
    networks:
      - meo-net

  # ----------------------------------------------------------------
  # 3. Python Schematic Analysis Microservice (AST & Linting)
  # ----------------------------------------------------------------
  python-service:
    build:
      context: ./python_service
      dockerfile_inline: |
        FROM python:3.11-alpine
        WORKDIR /app
        COPY app.py ./
        EXPOSE 5002
        CMD ["python", "app.py"]
    container_name: meo-python-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    networks:
      - meo-net

networks:
  meo-net:
    driver: bridge
